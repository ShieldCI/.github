name: Tests

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop

jobs:
  analyzers-core:
    runs-on: ubuntu-latest
    name: Analyzers Core Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: xdebug

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: analyzers-core/vendor
          key: ${{ runner.os }}-analyzers-core-${{ hashFiles('analyzers-core/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-analyzers-core-

      - name: Install dependencies
        working-directory: analyzers-core
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        working-directory: analyzers-core
        run: composer test

      - name: Run PHPStan
        working-directory: analyzers-core
        run: composer analyse

  laravel-package:
    runs-on: ubuntu-latest
    name: Laravel Package Tests
    needs: analyzers-core

    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3]
        laravel: [9.*, 10.*, 11.*]
        exclude:
          # Laravel 11 requires PHP 8.2+
          - laravel: 11.*
            php: 8.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: xdebug

      - name: Cache Composer packages (analyzers-core)
        id: composer-cache-core
        uses: actions/cache@v3
        with:
          path: analyzers-core/vendor
          key: ${{ runner.os }}-analyzers-core-${{ hashFiles('analyzers-core/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-analyzers-core-

      - name: Cache Composer packages (laravel)
        id: composer-cache-laravel
        uses: actions/cache@v3
        with:
          path: laravel/vendor
          key: ${{ runner.os }}-laravel-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('laravel/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-laravel-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-

      - name: Install analyzers-core dependencies
        working-directory: analyzers-core
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install laravel package dependencies
        working-directory: laravel
        run: |
          composer require "illuminate/console:${{ matrix.laravel }}" "illuminate/contracts:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        working-directory: laravel
        run: composer test

      - name: Run PHPStan
        working-directory: laravel
        run: composer analyse
        if: matrix.php == '8.2' && matrix.laravel == '11.*'

  example-app:
    runs-on: ubuntu-latest
    name: Example App Tests
    needs: laravel-package

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: example-app/package-lock.json

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: |
            analyzers-core/vendor
            laravel/vendor
            example-app/vendor
          key: ${{ runner.os }}-example-app-${{ hashFiles('example-app/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-example-app-

      - name: Install analyzers-core dependencies
        working-directory: analyzers-core
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install laravel package dependencies
        working-directory: laravel
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install example-app dependencies
        working-directory: example-app
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install npm dependencies
        working-directory: example-app
        run: npm ci

      - name: Copy .env.example to .env
        working-directory: example-app
        run: cp .env.example .env

      - name: Generate application key
        working-directory: example-app
        run: php artisan key:generate

      - name: Run tests
        working-directory: example-app
        run: php artisan test

      - name: Run ShieldCI analysis
        working-directory: example-app
        run: php artisan shield:analyze --format=json --output=shieldci-report.json
        continue-on-error: true

      - name: Upload ShieldCI report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: shieldci-report
          path: example-app/shieldci-report.json

